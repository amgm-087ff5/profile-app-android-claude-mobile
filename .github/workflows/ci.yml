name: CI

on:
  push:
    # theme/** は見た目の作業ブランチ(別ワークツリー)。main と同じくビルド・撮影する
    branches: [main, 'theme/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        shell: bash
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      # 失敗時にエラー要約をannotationとして残す(ログ全文を開かなくても原因が分かる)
      - name: Summarize failure
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong|Caused by|\[Hilt\]|\[Dagger|Execution failed' -A4 build.log | head -80 > summary.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' summary.txt | head -c 3500)
          echo "::error title=Gradle failure::${msg}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/outputs/apk/debug/*.apk

  # 見た目の確認。すりガラスはGPUのシェーダーで描くので、Androidエミュレータで実際に描いて撮る
  device-screenshots:
    runs-on: ubuntu-latest
    permissions:
      # 画像を screenshots ブランチへ置くため
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        shell: bash
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee build.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # 登場の動きも撮るので、端末のアニメーションは止めない
          disable-animations: false
          script: bash scripts/device-screenshots.sh

      - name: Summarize failure
        if: failure()
        run: |
          cat build.log instrument.log 2>/dev/null \
            | grep -E '^e: |error:|What went wrong|Exception|Error|at com\.example|FAILURES|Tests run' -A3 | head -80 > summary.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' summary.txt | head -c 3500)
          echo "::error title=Device screenshot failure::${msg}"

      # 画像を screenshots ブランチに置く(毎回作り直す。スマホのGitHubからも見られる)。
      # main 以外のブランチは screenshots-<ブランチ名> に置き、main の画像を上書きしない
      - name: Publish screenshots
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target=screenshots
          if [ "$GITHUB_REF_NAME" != main ]; then target="screenshots-${GITHUB_REF_NAME//\//-}"; fi
          src="$PWD/shots/screenshots"
          tmp=$(mktemp -d)
          cp "$src"/*.png "$tmp"/
          cp "$src"/interactions.webp "$src"/interactions.gif "$tmp"/ 2>/dev/null || true
          cp "$src"/koke_scroll.webp "$src"/koke_scroll.gif "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          {
            printf '# Screenshots\n\n%s(%s)のスクリーンショット(Androidエミュレータ API 34 / Pixel 6 で *ScreenshotTest が撮影)\n\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME"
            if [ -f interactions.webp ]; then
              printf '## 動き(登場 → ボタンを押して離す → スイッチ → トグル → タブ)\n\n![interactions](interactions.webp)\n\n'
              printf '動かない場合は [GIF版](interactions.gif)\n\n'
            fi
            if [ -f koke_scroll.webp ]; then
              printf '## Koke のスクロール(側面が覗き、苔が手前にずれる)\n\n![koke_scroll](koke_scroll.webp)\n\n'
              printf '動かない場合は [GIF版](koke_scroll.gif)\n\n'
            fi
            for f in *.png; do printf '## %s\n\n![%s](%s)\n\n' "${f%.png}" "$f" "$f"; done
          } > README.md
          git init -q -b "$target"
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$target"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screenshots
          path: |
            shots/
            instrument.log
